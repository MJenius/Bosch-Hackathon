<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <text x="50" y="45" font-size="24" font-weight="700" fill="#f8fafc">Incident Zero Architecture: Eyes &amp; Brain</text>
  <text x="50" y="70" font-size="13" fill="#94a3b8">Autonomous Telemetry Observation (Checkpoint 1) &amp; Evidence-Driven Root Cause Diagnosis (Checkpoint 2)</text>

  <!-- Section 1: Astronomy Shop Demo Layer -->
  <rect x="50" y="95" width="460" height="200" rx="12" fill="url(#grad-blue)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="65" y="105" width="230" height="22" rx="4" fill="#1e3a5f"/>
  <text x="75" y="120" font-size="11" font-weight="600" fill="#38bdf8">DEMO &amp; TELEMETRY GENERATION LAYER</text>

  <rect x="70" y="140" width="190" height="65" rx="8" fill="url(#grad-card)" stroke="#475569"/>
  <text x="80" y="162" font-size="13" font-weight="600" fill="#f1f5f9">Astronomy Shop Services</text>
  <text x="80" y="180" font-size="10" fill="#94a3b8">14+ Microservices (Go, C#, Java, Node)</text>
  <text x="80" y="195" font-size="10" fill="#94a3b8">frontend, checkout, payment, catalog...</text>

  <rect x="290" y="140" width="190" height="65" rx="8" fill="url(#grad-card)" stroke="#475569"/>
  <text x="300" y="162" font-size="13" font-weight="600" fill="#f1f5f9">Locust &amp; Flagd</text>
  <text x="300" y="180" font-size="10" fill="#94a3b8">Continuous synthetic browser traffic</text>
  <text x="300" y="195" font-size="10" fill="#cbd5e1">Fault flags: paymentFailure, cartFailure</text>

  <rect x="180" y="225" width="200" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-dasharray="3,3"/>
  <text x="200" y="246" font-size="12" font-weight="600" fill="#38bdf8">OpenTelemetry Collector</text>
  <text x="200" y="262" font-size="10" fill="#94a3b8">Spanmetrics Connector + OTLP Exporters</text>

  <!-- Flow arrows Demo -> Collector -->
  <line x1="165" y1="205" x2="230" y2="225" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="385" y1="205" x2="330" y2="225" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Section 2: Observability Backends -->
  <rect x="580" y="95" width="470" height="200" rx="12" fill="url(#grad-blue)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="595" y="105" width="180" height="22" rx="4" fill="#1e3a5f"/>
  <text x="605" y="120" font-size="11" font-weight="600" fill="#38bdf8">OBSERVABILITY BACKENDS</text>

  <rect x="600" y="140" width="200" height="60" rx="8" fill="url(#grad-card)" stroke="#475569"/>
  <text x="612" y="162" font-size="13" font-weight="600" fill="#f8fafc">Prometheus (:9090)</text>
  <text x="612" y="180" font-size="10" fill="#94a3b8">Rate, error ratio, p95 latency</text>
  <text x="612" y="193" font-size="9" fill="#64748b">Instant &amp; Range PromQL queries</text>

  <rect x="830" y="140" width="200" height="60" rx="8" fill="url(#grad-card)" stroke="#475569"/>
  <text x="842" y="162" font-size="13" font-weight="600" fill="#f8fafc">Jaeger v2 (:8080)</text>
  <text x="842" y="180" font-size="10" fill="#94a3b8">Distributed traces via API v3</text>
  <text x="842" y="193" font-size="9" fill="#64748b">Leaf error span &amp; causality traces</text>

  <rect x="600" y="215" width="200" height="60" rx="8" fill="url(#grad-card)" stroke="#475569"/>
  <text x="612" y="237" font-size="13" font-weight="600" fill="#f8fafc">OpenSearch (:9200)</text>
  <text x="612" y="255" font-size="10" fill="#94a3b8">Structured logs via PPL</text>
  <text x="612" y="268" font-size="9" fill="#64748b">severity &gt;= 13 (WARN/ERROR)</text>

  <rect x="830" y="215" width="200" height="60" rx="8" fill="url(#grad-card)" stroke="#475569"/>
  <text x="842" y="237" font-size="13" font-weight="600" fill="#f8fafc">Git Code Changes</text>
  <text x="842" y="255" font-size="10" fill="#94a3b8">Repository commit history</text>
  <text x="842" y="268" font-size="9" fill="#64748b">Bounded read-only commit metadata</text>

  <!-- Connect Collector to Backends -->
  <line x1="380" y1="240" x2="590" y2="175" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <line x1="380" y1="250" x2="590" y2="245" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- Section 3: Incident Zero - Checkpoint 1: EYES -->
  <rect x="50" y="325" width="460" height="280" rx="12" fill="url(#grad-blue)" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="65" y="335" width="260" height="22" rx="4" fill="#0369a1"/>
  <text x="75" y="350" font-size="11" font-weight="600" fill="#ffffff">CHECKPOINT 1 (EYES) - TELEMETRY OBSERVER</text>

  <rect x="70" y="375" width="420" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="82" y="396" font-size="12" font-weight="600" fill="#38bdf8">DiagnosticToolkit (telemetry.py)</text>
  <text x="82" y="412" font-size="10" fill="#94a3b8">Bounded queries, timeout control, NaN/Inf sanitization, safe Git change inspection</text>

  <rect x="70" y="435" width="420" height="50" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="82" y="456" font-size="12" font-weight="600" fill="#38bdf8">Investigation Workflow (workflow.py)</text>
  <text x="82" y="472" font-size="10" fill="#94a3b8">Rule-based telemetry-only planner + LangChain planner fallback</text>

  <rect x="70" y="495" width="420" height="95" rx="6" fill="#0f172a" stroke="#0284c7"/>
  <text x="82" y="516" font-size="12" font-weight="600" fill="#f8fafc">ObservationReport (models.py)</text>
  <text x="82" y="533" font-size="10" fill="#38bdf8">Schema: incident-zero/observation/v1</text>
  <text x="82" y="549" font-size="10" fill="#cbd5e1">- ToolCall Audit Log: query, duration, result, errors</text>
  <text x="82" y="563" font-size="10" fill="#cbd5e1">- Evidence IDs: ev-1, ev-2 (linked to successful queries)</text>
  <text x="82" y="577" font-size="10" fill="#cbd5e1">- Findings: distinct Observations vs Hypotheses</text>

  <!-- Query Backends from Eyes -->
  <line x1="490" y1="390" x2="590" y2="180" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <line x1="490" y1="400" x2="820" y2="180" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <line x1="490" y1="410" x2="590" y2="235" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <line x1="490" y1="420" x2="820" y2="240" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <!-- Section 4: Incident Zero - Checkpoint 2: BRAIN -->
  <rect x="580" y="325" width="470" height="280" rx="12" fill="url(#grad-blue)" stroke="#9333ea" stroke-width="2" filter="url(#shadow)"/>
  <rect x="595" y="335" width="270" height="22" rx="4" fill="#6b21a8"/>
  <text x="605" y="350" font-size="11" font-weight="600" fill="#ffffff">CHECKPOINT 2 (BRAIN) - ROOT CAUSE DIAGNOSIS</text>

  <rect x="600" y="375" width="430" height="52" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="612" y="396" font-size="12" font-weight="600" fill="#c084fc">Diagnosis Engine (diagnosis.py)</text>
  <text x="612" y="412" font-size="10" fill="#94a3b8">Strict evidence verification, causal propagation mapping, alternative hypothesis vetting</text>

  <rect x="600" y="437" width="430" height="50" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="612" y="457" font-size="12" font-weight="600" fill="#c084fc">Evidence-Driven Integrity Gate</text>
  <text x="612" y="473" font-size="10" fill="#94a3b8">Filters hallucinated IDs; enforces confidence &lt;= 0.4 on insufficient evidence</text>

  <rect x="600" y="497" width="430" height="95" rx="6" fill="#0f172a" stroke="#9333ea"/>
  <text x="612" y="518" font-size="12" font-weight="600" fill="#f8fafc">DiagnosisReport (diagnosis_models.py)</text>
  <text x="612" y="534" font-size="10" fill="#c084fc">Schema: incident-zero/diagnosis/v1</text>
  <text x="612" y="550" font-size="10" fill="#cbd5e1">- root_cause &amp; numeric confidence (e.g. 0.88 confirmed)</text>
  <text x="612" y="564" font-size="10" fill="#cbd5e1">- causal_chain: leaf failure -&gt; upstream microservices</text>
  <text x="612" y="578" font-size="10" fill="#cbd5e1">- supporting_evidence_ids (verified against observation report)</text>

  <!-- Connect Eyes to Brain -->
  <line x1="490" y1="520" x2="570" y2="460" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <!-- Section 5: Delivery & Human Operator Layer -->
  <rect x="50" y="635" width="1000" height="175" rx="12" fill="url(#grad-blue)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="65" y="645" width="220" height="22" rx="4" fill="#065f46"/>
  <text x="75" y="660" font-size="11" font-weight="600" fill="#34d399">OPERATOR SURFACES &amp; GOVERNANCE</text>

  <rect x="70" y="680" width="220" height="95" rx="8" fill="url(#grad-card)" stroke="#475569"/>
  <text x="82" y="702" font-size="12" font-weight="600" fill="#f8fafc">CLI &amp; REST Endpoints</text>
  <text x="82" y="720" font-size="10" fill="#cbd5e1">python -m src.incident.cli</text>
  <text x="82" y="736" font-size="10" fill="#cbd5e1">POST /incident/investigate</text>
  <text x="82" y="752" font-size="10" fill="#cbd5e1">POST /incident/diagnose</text>

  <rect x="330" y="680" width="310" height="95" rx="8" fill="url(#grad-card)" stroke="#475569"/>
  <text x="342" y="702" font-size="12" font-weight="600" fill="#f8fafc">Human Reviewer (SRE on-call)</text>
  <text x="342" y="722" font-size="10" fill="#cbd5e1">- Reviews validated diagnosis and causal chain</text>
  <text x="342" y="738" font-size="10" fill="#cbd5e1">- Verifies supporting evidence IDs</text>
  <text x="342" y="754" font-size="10" fill="#cbd5e1">- Evaluates non-automated safe action suggestions</text>

  <rect x="680" y="680" width="350" height="95" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-dasharray="4,4"/>
  <text x="695" y="702" font-size="12" font-weight="600" fill="#fbbf24">Future Day 2: Autonomous Remediation</text>
  <text x="695" y="722" font-size="10" fill="#94a3b8">Requires explicit human approval + safe rollback/kill-switch.</text>
  <text x="695" y="738" font-size="10" fill="#f87171">Brain strictly outputs is_automated_execution=false.</text>
  <text x="695" y="754" font-size="10" fill="#94a3b8">No automatic cluster edits executed in Checkpoint 2.</text>

  <!-- Connect Brain to Delivery -->
  <line x1="720" y1="605" x2="250" y2="675" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="290" y1="725" x2="320" y2="725" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="725" x2="670" y2="725" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
</svg>
